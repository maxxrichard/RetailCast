[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retailcast"
version = "0.3.0"
description = "Hierarchical, probabilistic demand forecasting for e-commerce assortments (M5 / Favorita) with LightGBM, statistical baselines, MinT reconciliation and rolling-origin backtests."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maxx Richard Rahman" }]
keywords = ["forecasting", "retail", "hierarchical", "lightgbm", "pyspark", "databricks", "m5"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "lightgbm>=4.0",
  "pyyaml>=6.0",
  "typer>=0.9",
  "rich>=13.0",
]

[project.optional-dependencies]
stats = ["statsforecast>=1.7"]
tft = ["torch>=2.1", "pytorch-forecasting>=1.0", "lightning>=2.1"]
spark = ["pyspark>=3.4", "delta-spark>=3.0", "mlflow>=2.9"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.8", "pre-commit>=3.5", "statsforecast>=1.7"]
all = ["retailcast[stats,tft,spark,dev]"]

[project.scripts]
retailcast = "retailcast.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["N803", "N806", "B905"]

[tool.ruff.lint.per-file-ignores]
"src/retailcast/spark/*" = ["N812"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
