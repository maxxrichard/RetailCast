extends: default.yaml

model:
  name: tft
  max_encoder_length: 84
  max_prediction_length: 28
  hidden_size: 64
  attention_head_size: 4
  dropout: 0.1
  hidden_continuous_size: 32
  learning_rate: 0.001
  batch_size: 512
  max_epochs: 30
  gradient_clip_val: 0.1
  quantiles: [0.05, 0.25, 0.5, 0.75, 0.95]
