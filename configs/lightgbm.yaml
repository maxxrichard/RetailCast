extends: default.yaml

model:
  name: lightgbm
  strategy: direct             # direct multi-horizon (one booster per horizon group) | recursive
  horizon_groups: [[1, 7], [8, 14], [15, 28]]
  objective: tweedie
  tweedie_variance_power: 1.1
  params:
    learning_rate: 0.03
    num_leaves: 127
    min_data_in_leaf: 100
    feature_fraction: 0.7
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 0.1
    max_bin: 255
    verbosity: -1
    seed: 42
  num_boost_round: 1500
  early_stopping_rounds: 100
  quantile_heads: true          # additionally fit pinball-loss boosters for each quantile
